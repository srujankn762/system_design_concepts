apiVersion: apps/v1
kind: Deployment

metadata:
  name: hello-world

spec:
  replicas: 1

  selector:
    matchLabels:
      app: hello-world

  template:
    metadata:
      labels:
        app: hello-world

    spec:
      imagePullSecrets:
        - name: ghcr-secret

      containers:
        - name: hello-world
          image: ghcr.io/srujankn762/hello-world-image:v2
          ports:
            - containerPort: 8055

          env:
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB

            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD

            - name: DB_HOST
              value: postgres-service

            - name: DB_PORT
              value: "5432"